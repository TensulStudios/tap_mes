<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRAKILL Prelude DEMO</title>
    <style>
        iframe {
            position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;
        }
    </style>
</head>
<body>
    <iframe id="frame" src="https://html-classic.itch.zone/html/15139480/ultrakill/index.html"></iframe>
    <script>
        function setUserAgent(window, userAgent) {
            if (window.navigator.userAgent != userAgent) {
                var userAgentProp = { get: function() { return userAgent; } };
                try {
                    Object.defineProperty(window.navigator, 'userAgent', userAgentProp);
                } catch (e) {
                    window.navigator = Object.create(navigator, { userAgent: userAgentProp });
                }
            }
        }

        document.getElementById("frame").addEventListener("load", function() {
            setUserAgent(this.contentWindow, "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Mobile Safari/537.36");
        });
    </script>
</body>
</html>
