<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRAKILL Prelude DEMO</title>
    <style>
        iframe {
            position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; background-color: black; padding:0; overflow:hidden; z-index:999999;
        }
    </style>
</head>
<body>
    <iframe id="frame" src="https://html-classic.itch.zone/html/15139480/ultrakill/index.html" allowfullscreen></iframe>
    <script>
        // Source - https://stackoverflow.com/a/24764878
        // Posted by Korvo, modified by community. See post 'Timeline' for change history
        // Retrieved 2026-03-19, License - CC BY-SA 4.0
        
        window.onbeforeunload = function (e) {
            // Cancel the event
            e.preventDefault();
        
            // Chrome requires returnValue to be set
            e.returnValue = 'Really want to quit the game?';
        };
        
        //Prevent Ctrl+S (and Ctrl+W for old browsers and Edge)
        document.onkeydown = function (e) {
            e = e || window.event;//Get event
        
            if (!e.ctrlKey) return;
        
            var code = e.which || e.keyCode;//Get key code
        
            switch (code) {
                case 83://Block Ctrl+S
                case 87://Block Ctrl+W -- Not work in Chrome and new Firefox
                    e.preventDefault();
                    e.stopPropagation();
                    break;
            }
        };
    </script>
</body>
</html>
