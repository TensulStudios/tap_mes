<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRAKILL Prelude DEMO</title>
    <style>
        iframe {
            position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;
        }
    </style>
</head>
<body>
    <iframe id="frame" src="https://html-classic.itch.zone/html/15139480/ultrakill/index.html" allowfullscreen></iframe>
    <script>
        var interval = setInterval(function() {
            try {
                var canvas = document.getElementById("frame").contentDocument.querySelector("#unity-canvas");
                if (!canvas) return;
                canvas.style.width = "100%";
                canvas.style.height = "100%";
                canvas.style.position = "fixed";
                canvas.style.top = "0";
                canvas.style.left = "0";
                document.getElementById("frame").contentDocument.body.style.margin = "0";
                clearInterval(interval);
            } catch(e) {}
        }, 500);
    </script>
</body>
</html>
