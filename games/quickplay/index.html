<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Tap Mes Quick Play</title>
  <style>
    :root { color-scheme: dark; font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: #101b28; color: #f5f3e8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: 62px minmax(0, 1fr); background: radial-gradient(ellipse at 75% 5%, #27576b 0, #182838 42%, #101b28 100%); }
    .topbar { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-bottom: 1px solid rgba(231, 239, 229, .16); background: rgba(9, 18, 28, .58); }
    .title { flex: 1; min-width: 0; overflow: hidden; color: #f7f1dc; font-size: 17px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .scoreboard { display: flex; align-items: center; gap: 16px; color: #bfced3; font-size: 12px; font-weight: 700; }
    .scoreboard strong { display: block; color: #f4d76d; font-size: 16px; text-align: right; }
    .start-button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 4px; color: #14242d; background: #f4d76d; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
    .start-button:hover { background: #ffe895; }
    main { position: relative; min-height: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hint { position: absolute; right: 12px; bottom: 10px; left: 12px; color: rgba(236, 241, 234, .74); font-size: 12px; line-height: 1.4; text-align: center; pointer-events: none; }
    @media (max-width: 540px) {
      body { grid-template-rows: 58px minmax(0, 1fr); }
      .topbar { gap: 8px; padding: 0 10px; }
      .title { font-size: 14px; }
      .scoreboard { gap: 8px; font-size: 10px; }
      .scoreboard strong { font-size: 14px; }
      .start-button { min-height: 36px; padding: 0 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title" id="title"></div>
    <div class="scoreboard">
      <div>TIME<strong id="time">30</strong></div>
      <div>SCORE<strong id="score">0</strong></div>
    </div>
    <button class="start-button" id="start" type="button">Start round</button>
  </header>
  <main>
    <canvas id="stage" tabindex="0" aria-label="Game area"></canvas>
    <div class="hint" id="hint"></div>
  </main>
  <script>
    (() => {
      const modes = {
        hoops: { title: 'Pocket Hoops', hint: 'Drag back from the ball and release to shoot. Land it through the moving hoop.' },
        soccer: { title: 'Goal Rush', hint: 'Drag back from the ball and release to shoot past the moving keeper.' },
        volley: { title: 'Sky Volley', hint: 'Tap or click the falling ball to keep the rally going. How many touches can you get?' },
        draw: { title: 'Quick Draw', hint: 'Wait for the target to appear, then tap it as quickly as you can. Do not click early.' }
      };
      const mode = modes[new URLSearchParams(location.search).get('mode')] ? new URLSearchParams(location.search).get('mode') : 'hoops';
      const config = modes[mode];
      const canvas = document.querySelector('#stage');
      const context = canvas.getContext('2d');
      const main = document.querySelector('main');
      const title = document.querySelector('#title');
      const timeDisplay = document.querySelector('#time');
      const scoreDisplay = document.querySelector('#score');
      const startButton = document.querySelector('#start');
      const hint = document.querySelector('#hint');
      let width = 0;
      let height = 0;
      let ratio = 1;
      let active = false;
      let finished = false;
      let score = 0;
      let timeLeft = 30;
      let lastFrame = 0;
      let elapsed = 0;
      let ball = null;
      let dragPoint = null;
      let target = null;
      let nextTargetAt = 0;
      let volleyTouches = 0;

      title.textContent = config.title;
      hint.textContent = `${config.hint} Press L to return to the library.`;

      const resize = () => {
        const bounds = main.getBoundingClientRect();
        ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        resetBall();
        draw(performance.now());
      };

      const resetBall = () => {
        ball = { x: width * .2, y: height * .78, vx: 0, vy: 0, radius: Math.max(15, Math.min(23, width * .025)), flying: false };
        dragPoint = null;
      };

      const startRound = () => {
        score = 0;
        timeLeft = 30;
        elapsed = 0;
        volleyTouches = 0;
        target = null;
        nextTargetAt = performance.now() + 850 + Math.random() * 1450;
        resetBall();
        active = true;
        finished = false;
        startButton.textContent = 'Restart round';
        lastFrame = performance.now();
        canvas.focus({ preventScroll: true });
      };

      const finishRound = () => {
        active = false;
        finished = true;
        target = null;
        startButton.textContent = 'Play again';
      };

      const pointerPosition = (event) => {
        const bounds = canvas.getBoundingClientRect();
        return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
      };

      const targetPoint = (now) => {
        const hoopX = width * .77 + Math.sin(now / 1050) * width * .07;
        const hoopY = height * .36 + Math.sin(now / 810) * height * .035;
        return { x: hoopX, y: hoopY };
      };

      const goalPoint = (now) => ({ x: width * .82, y: height * .53 + Math.sin(now / 730) * height * .09 });

      canvas.addEventListener('pointerdown', (event) => {
        if (!active) return;
        const point = pointerPosition(event);
        if (mode === 'draw') {
          if (!target) return;
          if (Math.hypot(point.x - target.x, point.y - target.y) <= target.radius) {
            score += Math.max(1, Math.round(1000 - (performance.now() - target.createdAt) * .4));
            scoreDisplay.textContent = String(score);
            target = null;
            nextTargetAt = performance.now() + 700 + Math.random() * 1500;
          }
          return;
        }
        if (mode === 'volley') {
          if (ball.y > height * .31 && point.y > height * .2) {
            ball.vy = -Math.max(440, height * .78);
            ball.vx = (ball.x - point.x) * 1.5;
            volleyTouches += 1;
            score += 1;
            scoreDisplay.textContent = String(score);
          }
          return;
        }
        if (!ball.flying && Math.hypot(point.x - ball.x, point.y - ball.y) < ball.radius * 4) {
          canvas.setPointerCapture(event.pointerId);
          dragPoint = point;
        }
      });

      canvas.addEventListener('pointermove', (event) => {
        if (dragPoint) dragPoint = pointerPosition(event);
      });

      canvas.addEventListener('pointerup', () => {
        if (!dragPoint || ball.flying) return;
        const pullX = ball.x - dragPoint.x;
        const pullY = ball.y - dragPoint.y;
        const scale = mode === 'hoops' ? 3.3 : 3.6;
        ball.vx = Math.max(-220, Math.min(width * .95, pullX * scale));
        ball.vy = Math.max(-height * 1.15, Math.min(-150, pullY * scale));
        ball.flying = true;
        dragPoint = null;
      });

      const updateBallGame = (delta, now) => {
        if (mode === 'volley') {
          ball.vy += height * 1.4 * delta;
          ball.x += ball.vx * delta;
          ball.y += ball.vy * delta;
          if (ball.x < ball.radius || ball.x > width - ball.radius) ball.vx *= -1;
          ball.x = Math.max(ball.radius, Math.min(width - ball.radius, ball.x));
          if (ball.y > height - ball.radius - 10) {
            ball.y = height * .7;
            ball.vy = 0;
            ball.vx = (Math.random() - .5) * width * .35;
            volleyTouches = 0;
          }
          return;
        }
        if (!ball.flying) return;
        const previousX = ball.x;
        ball.vy += height * .95 * delta;
        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;
        const targetPosition = mode === 'hoops' ? targetPoint(now) : goalPoint(now);
        if (previousX < targetPosition.x && ball.x >= targetPosition.x) {
          const verticalTolerance = mode === 'hoops' ? 32 : height * .12;
          const goalkeeperY = targetPosition.y + Math.sin(now / 260) * height * .07;
          const blockedByKeeper = mode === 'soccer' && Math.abs(ball.y - goalkeeperY) < height * .075;
          if (Math.abs(ball.y - targetPosition.y) < verticalTolerance && !blockedByKeeper) {
            score += 1;
            scoreDisplay.textContent = String(score);
          }
          resetBall();
        }
        if (ball.x > width + ball.radius || ball.y > height + ball.radius || ball.y < -ball.radius) resetBall();
      };

      const update = (delta, now) => {
        elapsed += delta;
        timeLeft = Math.max(0, 30 - Math.floor(elapsed));
        timeDisplay.textContent = String(timeLeft);
        if (mode === 'draw' && !target && now >= nextTargetAt) {
          target = {
            x: width * (.18 + Math.random() * .64),
            y: height * (.2 + Math.random() * .55),
            radius: Math.max(25, Math.min(42, width * .045)),
            createdAt: now
          };
        }
        updateBallGame(delta, now);
        if (timeLeft <= 0) finishRound();
      };

      const roundRect = (x, y, w, h, radius, color) => {
        context.fillStyle = color;
        context.beginPath();
        context.roundRect(x, y, w, h, radius);
        context.fill();
      };

      const drawCourt = (now) => {
        const floor = height * .84;
        const gradient = context.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#244457');
        gradient.addColorStop(1, '#142633');
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);
        context.fillStyle = '#cf7650';
        context.fillRect(0, floor, width, height - floor);
        context.fillStyle = 'rgba(255,255,255,.22)';
        context.fillRect(0, floor, width, 3);
        context.beginPath();
        context.arc(width * .5, floor, height * .16, Math.PI, 0);
        context.strokeStyle = 'rgba(255,255,255,.18)';
        context.lineWidth = 2;
        context.stroke();
        if (mode === 'hoops') {
          const hoop = targetPoint(now);
          roundRect(hoop.x + 24, hoop.y - 58, 12, 74, 4, '#f0d77a');
          context.beginPath();
          context.moveTo(hoop.x + 10, hoop.y - 48);
          context.lineTo(hoop.x + 50, hoop.y - 48);
          context.lineTo(hoop.x + 50, hoop.y - 18);
          context.strokeStyle = '#f8f3df';
          context.lineWidth = 5;
          context.stroke();
          context.beginPath();
          context.moveTo(hoop.x - 24, hoop.y);
          context.lineTo(hoop.x + 22, hoop.y);
          context.strokeStyle = '#e46d49';
          context.lineWidth = 6;
          context.stroke();
          context.strokeStyle = 'rgba(255,255,255,.55)';
          context.lineWidth = 1;
          for (let i = 0; i < 5; i += 1) {
            context.beginPath();
            context.moveTo(hoop.x - 18 + i * 9, hoop.y + 2);
            context.lineTo(hoop.x - 12 + i * 6, hoop.y + 34);
            context.stroke();
          }
        } else {
          const goal = goalPoint(now);
          roundRect(goal.x, goal.y - height * .12, 12, height * .24, 3, '#f0d77a');
          roundRect(goal.x - 66, goal.y - height * .12, 68, 8, 3, '#f8f3df');
          roundRect(goal.x - 66, goal.y + height * .12 - 8, 68, 8, 3, '#f8f3df');
          context.strokeStyle = 'rgba(255,255,255,.3)';
          context.lineWidth = 1;
          for (let i = 1; i < 4; i += 1) {
            context.beginPath();
            context.moveTo(goal.x - 64 + i * 16, goal.y - height * .1);
            context.lineTo(goal.x - 64 + i * 16, goal.y + height * .1);
            context.stroke();
          }
          if (mode === 'soccer') {
            const keeperY = goal.y + Math.sin(now / 260) * height * .07;
            roundRect(goal.x - 45, keeperY - 22, 20, 44, 8, '#54c3ab');
          }
        }
      };

      const drawVolley = () => {
        const gradient = context.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#1c4e71');
        gradient.addColorStop(1, '#142633');
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);
        context.fillStyle = '#d3a45f';
        context.fillRect(0, height * .8, width, height * .2);
        context.fillStyle = 'rgba(255,255,255,.22)';
        context.fillRect(0, height * .8, width, 3);
        context.fillStyle = '#f5edd6';
        context.fillRect(width * .69, height * .56, 4, height * .24);
        for (let y = height * .58; y < height * .8; y += 15) context.fillRect(width * .64, y, width * .1, 1);
        for (let x = width * .64; x < width * .75; x += 14) context.fillRect(x, height * .56, 1, height * .24);
        roundRect(width * .31, height * .68, 34, 84, 12, '#e87858');
        roundRect(width * .66, height * .68, 34, 84, 12, '#4ab9a5');
      };

      const drawDraw = (now) => {
        const gradient = context.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#432d54');
        gradient.addColorStop(1, '#153c4a');
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);
        if (target) {
          const pulse = 1 + Math.sin(now / 110) * .06;
          context.beginPath();
          context.arc(target.x, target.y, target.radius * pulse, 0, Math.PI * 2);
          context.fillStyle = '#ec6d50';
          context.fill();
          context.beginPath();
          context.arc(target.x, target.y, target.radius * .57, 0, Math.PI * 2);
          context.fillStyle = '#f3d76c';
          context.fill();
          context.beginPath();
          context.arc(target.x, target.y, target.radius * .2, 0, Math.PI * 2);
          context.fillStyle = '#f7f0de';
          context.fill();
        } else if (active) {
          context.fillStyle = 'rgba(255,255,255,.84)';
          context.font = `700 ${Math.max(18, Math.min(26, width * .035))}px Trebuchet MS`;
          context.textAlign = 'center';
          context.fillText('Wait for the target…', width * .5, height * .48);
        }
      };

      const draw = (now) => {
        if (!width || !height) return;
        if (mode === 'volley') drawVolley();
        else if (mode === 'draw') drawDraw(now);
        else drawCourt(now);
        if (mode === 'volley' || mode === 'hoops' || mode === 'soccer') {
          if (ball) {
            if (dragPoint && !ball.flying) {
              context.beginPath();
              context.moveTo(ball.x, ball.y);
              context.lineTo(dragPoint.x, dragPoint.y);
              context.strokeStyle = 'rgba(255,255,255,.7)';
              context.lineWidth = 2;
              context.setLineDash([7, 6]);
              context.stroke();
              context.setLineDash([]);
            }
            context.beginPath();
            context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            context.fillStyle = mode === 'soccer' ? '#f4f0df' : '#df8050';
            context.fill();
            context.strokeStyle = 'rgba(15,31,41,.65)';
            context.lineWidth = 2;
            context.stroke();
            if (mode === 'soccer') {
              context.beginPath();
              context.arc(ball.x, ball.y, ball.radius * .42, 0, Math.PI * 2);
              context.stroke();
            } else {
              context.beginPath();
              context.moveTo(ball.x - ball.radius * .9, ball.y);
              context.lineTo(ball.x + ball.radius * .9, ball.y);
              context.moveTo(ball.x, ball.y - ball.radius * .9);
              context.lineTo(ball.x, ball.y + ball.radius * .9);
              context.stroke();
            }
          }
        }
        if (!active) {
          context.fillStyle = 'rgba(8,17,25,.45)';
          context.fillRect(0, 0, width, height);
          context.fillStyle = '#f5edd6';
          context.textAlign = 'center';
          context.font = `800 ${Math.max(25, Math.min(42, width * .055))}px Trebuchet MS`;
          context.fillText(finished ? `Round over: ${score}` : config.title, width * .5, height * .46);
          context.font = `600 ${Math.max(14, Math.min(18, width * .023))}px Trebuchet MS`;
          context.fillStyle = '#c9d7d7';
          context.fillText(finished ? 'Press Play again for another 30 seconds.' : 'A quick 30-second challenge', width * .5, height * .46 + 34);
        }
      };

      const frame = (now) => {
        const delta = Math.min(.04, Math.max(0, (now - lastFrame) / 1000));
        lastFrame = now;
        if (active) update(delta, now);
        draw(now);
        requestAnimationFrame(frame);
      };

      startButton.addEventListener('click', startRound);
      window.addEventListener('resize', resize);
      window.addEventListener('keydown', (event) => {
        if (event.key === ' ' && !active) {
          event.preventDefault();
          startRound();
        }
      });
      resize();
      requestAnimationFrame((now) => {
        lastFrame = now;
        frame(now);
      });
    })();
  </script>
</body>
</html>
