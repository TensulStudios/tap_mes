<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Startup Animation */
    .startup-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .startup-logo-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .startup-logo {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
    }

    .startup-logo.ghost {
      animation: ghostFade 1.5s ease-out forwards;
    }

    @keyframes ghostFade {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    .startup-fade {
      animation: startupFadeOut 0.8s ease-out 1.5s forwards;
    }

    @keyframes startupFadeOut {
      to {
        opacity: 0;
      }
    }

    .branding-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      opacity: 0;
      animation: brandingAppear 0.5s ease-out 2.3s forwards, brandingFadeOut 0.8s ease-out 4s forwards;
    }

    @keyframes brandingAppear {
      to {
        opacity: 1;
      }
    }

    @keyframes brandingFadeOut {
      to {
        opacity: 0;
        pointer-events: none;
      }
    }

    .branding-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 60px;
    }

    .branding-text {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
      opacity: 0;
      animation: textSlideIn 0.8s ease-out 2.5s forwards;
    }

    @keyframes textSlideIn {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Main Console UI */
    .console-screen {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      position: relative;
      opacity: 0;
      animation: mainFadeIn 1s ease-out 4.8s forwards;
    }

    @keyframes mainFadeIn {
      to {
        opacity: 1;
      }
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 10, 0.3);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .status-section {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.8);
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: rgba(255, 255, 255, 0.8);
    }

    .content-area {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    .games-grid {
      position: absolute;
      top: 80px;
      left: 100px;
      right: 100px;
      bottom: 100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 40px;
      overflow-y: auto;
      padding-bottom: 40px;
    }

    .games-grid::-webkit-scrollbar {
      width: 8px;
    }

    .games-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .games-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .game-card {
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-10px);
    }

    .game-card-inner {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .game-card:hover .game-card-inner {
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .game-image-container {
      width: 100%;
      height: 280px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    .game-info-section {
      padding: 20px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-publisher {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Game View */
    .game-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 1000;
      display: none;
    }

    .game-view.active {
      display: block;
    }

    .game-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1002;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      animation: headerFadeIn 0.8s ease-out 5.6s forwards;
      opacity: 0;
    }

    @keyframes headerFadeIn {
      to {
        opacity: 1;
      }
    }

    .game-header-text {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .game-sidebar {
      position: absolute;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100vh;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      z-index: 1001;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .game-sidebar.open {
      left: 0;
    }

    .sidebar-toggle {
      position: absolute;
      top: 50%;
      right: -40px;
      transform: translateY(-50%);
      width: 40px;
      height: 80px;
      background: rgba(10, 10, 10, 0.35);
      backdrop-filter: blur(9px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: none;
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sidebar-toggle:hover {
      background: rgba(20, 20, 20, 0.95);
    }

    .sidebar-toggle svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      transition: transform 0.3s;
    }

    .game-sidebar.open .sidebar-toggle svg {
      transform: rotate(180deg);
    }

    .game-iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .game-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .game-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      opacity: 1;
      animation: bottomBarFadeOut 1s ease-out 5.5s forwards;
      pointer-events: none;
    }

    @keyframes bottomBarFadeOut {
      to {
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .games-grid {
        left: 40px;
        right: 40px;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 30px;
      }

      .game-image-container {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- Startup Animation -->
  <div class="startup-screen startup-fade">
    <div class="startup-logo-container">
      <div class="startup-logo ghost">tOS</div>
      <div class="startup-logo">tOS</div>
    </div>
  </div>

  <div class="branding-screen">
    <div class="branding-bar">
      <div class="branding-text">Tames</div>
    </div>
  </div>

  <!-- Main Console UI -->
  <div class="console-screen">
    <div class="top-bar">
      <div class="user-section">
        <div class="user-avatar">2</div>
      </div>
      <div class="status-section">
        <span id="current-time">9:27 AM</span>
        <div class="battery-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zm-1 14.67h-5.33v-11h5.33v11z"/>
          </svg>
        </div>
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        </svg>
      </div>
    </div>

    <div class="content-area">
      <div id="loading" class="loading">Loading Games...</div>
      
      <div class="games-grid" id="games-grid"></div>
    </div>
  </div>

  <!-- Game View -->
  <div class="game-view" id="game-view">
    <div class="game-header">
      <div class="game-header-text">tames.online</div>
    </div>

    <div class="game-sidebar" id="game-sidebar">
      <div class="sidebar-toggle" id="sidebar-toggle">
        <svg viewBox="0 0 24 24">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </div>
    </div>

    <div class="game-iframe-container">
      <iframe class="game-iframe" id="game-iframe"></iframe>
    </div>

    <div class="game-overlay">
      <div class="game-bottom-bar"></div>
    </div>
  </div>

  <script>
    let games = [];

    function updateTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('current-time').textContent = `${hours}:${minutes} ${ampm}`;
    }

    updateTime();
    setInterval(updateTime, 60000);

    async function discoverGames() {
      const gamesGrid = document.getElementById('games-grid');
      const loadingElement = document.getElementById('loading');

      try {
        const commonGameNames = ['minecraft', 'baldi', '2048', 'seffects', 'fnf', 'unlikely', 'stc', 'wbwwb', 'llp', 'hungrylamu', 'hungrylamu2'];
        const foundGames = [];

        for (const gameName of commonGameNames) {
          try {
            const response = await fetch(`/games/${gameName}/game.json`);
            if (response.ok) {
              const gameData = await response.json();
              foundGames.push({ name: gameName, ...gameData, path: `/games/${gameName}/` });
            }
          } catch (error) {
            continue;
          }
        }

        loadingElement.style.display = 'none';

        if (foundGames.length === 0) {
          loadingElement.textContent = 'No games found';
          loadingElement.style.display = 'block';
          return;
        }

        games = foundGames;

        foundGames.forEach(game => {
          const card = createGameCard(game);
          gamesGrid.appendChild(card);
        });
      } catch (error) {
        loadingElement.textContent = `Error: ${error.message}`;
      }
    }

    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'game-card';

      const title = game.title || game.name || 'Unknown Game';
      const imageSrc = game.image || '';

      card.innerHTML = `
        <div class="game-card-inner">
          <div class="game-image-container">
            ${imageSrc ? 
              `<img src="${imageSrc}" alt="${title}" class="game-image" onerror="this.outerHTML='<div class=\\'game-placeholder\\'>${title}</div>'">` :
              `<div class="game-placeholder">${title}</div>`
            }
          </div>
          <div class="game-info-section">
            <div class="game-title">${title}</div>
            <div class="game-publisher">${game.creator || 'Tames'}</div>
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        launchGame(game);
      });

      return card;
    }

    function launchGame(game) {
      const gameView = document.getElementById('game-view');
      const gameIframe = document.getElementById('game-iframe');
      
      gameIframe.src = 'games/' + game.name;
      gameView.classList.add('active');
    }

    // Sidebar toggle
    const sidebar = document.getElementById('game-sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    sidebarToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      sidebar.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (sidebar.classList.contains('open') && 
          !sidebar.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });

    // Remove startup screens after animation
    setTimeout(() => {
      document.querySelector('.startup-screen').remove();
      document.querySelector('.branding-screen').remove();
    }, 5000);

    document.addEventListener('DOMContentLoaded', discoverGames);
  </script>
</body>
</html>
