<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    .startup-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .startup-logo-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .startup-logo {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
    }

    .startup-logo.ghost {
      animation: ghostFade 1.5s ease-out forwards;
    }

    @keyframes ghostFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    .startup-fade {
      animation: startupFadeOut 0.8s ease-out 1.5s forwards;
    }

    @keyframes startupFadeOut {
      to { opacity: 0; }
    }

    .branding-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      animation: brandingAppear 0.5s ease-out 2.3s forwards, brandingFadeOut 0.8s ease-out 4s forwards;
    }

    @keyframes brandingAppear {
      to { opacity: 1; pointer-events: auto; }
    }

    @keyframes brandingFadeOut {
      to { opacity: 0; pointer-events: none; }
    }

    .branding-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 60px;
    }

    .branding-text {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
      opacity: 0;
      animation: textSlideIn 0.8s ease-out 2.5s forwards;
    }

    @keyframes textSlideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .game-launch-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .game-launch-screen.active {
      display: flex;
    }

    .game-launch-image-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .game-launch-image {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-launch-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-launch-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      font-weight: 600;
      text-align: center;
      padding: 40px;
    }

    .game-launch-image.ghost {
      animation: gameLaunchGhostFade 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes gameLaunchGhostFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.4); }
    }

    .game-launch-fade {
      animation: gameLaunchFadeOut 0.8s ease-out 1.5s forwards;
    }

    @keyframes gameLaunchFadeOut {
      to { opacity: 0; }
    }

    .game-branding-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      opacity: 0;
      display: none;
    }

    .game-branding-screen.active {
      display: block;
      animation: gameBrandingAppear 0.5s ease-out forwards, gameBrandingFadeOut 0.8s ease-out 1.5s forwards;
    }

    @keyframes gameBrandingAppear {
      to { opacity: 1; }
    }

    @keyframes gameBrandingFadeOut {
      to { opacity: 0; pointer-events: none; }
    }

    .game-branding-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 60px;
    }

    .game-branding-text {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
      opacity: 0;
      animation: gameBrandingTextSlideIn 0.8s ease-out 0.2s forwards;
    }

    @keyframes gameBrandingTextSlideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .console-screen {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      position: relative;
      opacity: 0;
      animation: mainFadeIn 1s ease-out 4.8s forwards;
    }

    @keyframes mainFadeIn {
      to { opacity: 1; }
    }

    .content-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    .games-grid {
      position: absolute;
      top: 80px;
      left: 100px;
      right: 100px;
      bottom: 100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 40px;
      overflow-y: auto;
      padding-bottom: 40px;
    }

    .games-grid::-webkit-scrollbar {
      width: 8px;
    }

    .games-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .games-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .game-card {
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-10px);
    }

    .game-card-inner {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .game-card:hover .game-card-inner {
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .game-image-container {
      width: 100%;
      height: 280px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    .game-info-section {
      padding: 20px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-publisher {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.6);
    }

    .game-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 1000;
      display: none;
    }

    .game-view.active {
      display: block;
    }

    .game-iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .game-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .game-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      opacity: 0;
    }

    .game-bottom-bar.show {
      opacity: 1;
      animation: bottomBarFadeOut 1s ease-out 1s forwards;
    }

    @keyframes bottomBarFadeOut {
      to { opacity: 0; }
    }

    @media (max-width: 768px) {
      .games-grid {
        left: 40px;
        right: 40px;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 30px;
      }

      .game-image-container {
        height: 200px;
      }

      .game-launch-image-container {
        width: 280px;
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="startup-screen startup-fade">
    <div class="startup-logo-container">
      <div class="startup-logo ghost">tOS</div>
      <div class="startup-logo">tOS</div>
    </div>
  </div>

  <div class="branding-screen">
    <div class="branding-bar">
      <div class="branding-text">Tames</div>
    </div>
  </div>

  <div class="game-launch-screen" id="game-launch-screen">
    <div class="game-launch-image-container">
      <div class="game-launch-image ghost" id="game-launch-ghost"></div>
      <div class="game-launch-image" id="game-launch-main"></div>
    </div>
  </div>

  <div class="game-branding-screen" id="game-branding-screen">
    <div class="game-branding-bar">
      <div class="game-branding-text">Tames</div>
    </div>
  </div>

  <div class="console-screen">
    <div class="content-area">
      <div id="loading" class="loading">tames.online is loading even more games, we are not broken.</div>
      <div class="games-grid" id="games-grid"></div>
    </div>
  </div>

  <div class="game-view" id="game-view">
    <div class="game-iframe-container">
      <iframe class="game-iframe" id="game-iframe"></iframe>
    </div>

    <div class="game-overlay">
      <div class="game-bottom-bar" id="game-bottom-bar"></div>
    </div>
  </div>
  <script>
    let games = [];

    async function discoverGames() {
      const gamesGrid = document.getElementById('games-grid');
      const loadingElement = document.getElementById('loading');

      try {
        const commonGameNames = ['minecraft', 'baldi', '2048', 'seffects', 'fnf', 'unlikely', 'stc', 'wbwwb', 'llp', 'hungrylamu', 'hungrylamu2', 'ultrakill', 'death_loop_a_danganronpa_inspired_game', 'twilight_observer', 'a_mirror_s_curse_sfw', 'cobb_can_move', 'dungeon_mori', '13_bones', 'trees_hate_you_demo', 'kidnapped_for_a_date', 'the_margot_collapse', 'dragonsweeper', 'flesh_blood_concrete', 'a_tale_of_crowns', 'soul_void', 'what_body', 'wayfarer', 'deltarune_lightners_live_plus', 'purrgatory', 'different_strokes', 'scale_the_depths_now_on_steam', 'opossum_country', 'goodbye_doggy', 'her_trees_first_puzzle', 'b_e_e_t_l_e', 'honey_dress_up', 'when_twilight_strikes', 'sovereign_tower', 'dungeons_degenerate_gamblers', 'access_danied_demo', 'last_train_home', 'the_world_is_doomed_unless_i_can_raise_my_power_level_to_1_000_000_and_confront_the_demon_lord', 'taiyaki_fabulous_museum_of_fish', 'scritchy_scratchy', 'incremental_survivors', 'red_handed', 'grovebound', 'george_and_the_printer', 'skinator', 'glory_hunters', 'family', 'there_s_this_girl', 'generic_fighter_maybe', 'the_roottrees_are_dead', 'the_ratchelor_a_rat_dating_sim', 'little_chef_demo', 'silver_thread', 'small_town_emo_demo', 'demon_bluff', 'another_home'];
        const foundGames = [];

        for (const gameName of commonGameNames) {
          try {
            const response = await fetch(`/games/${gameName}/game.json`);
            if (response.ok) {
              const gameData = await response.json();
              foundGames.push({ name: gameName, ...gameData, path: `/games/${gameName}/` });
            }
          } catch (error) {
            continue;
          }
        }

        loadingElement.style.display = 'none';

        if (foundGames.length === 0) {
          loadingElement.textContent = 'No games found';
          loadingElement.style.display = 'block';
          return;
        }

        games = foundGames;

        foundGames.forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card';
          const title = game.title || game.name || 'Unknown Game';
          const imageSrc = game.image || '';
          card.innerHTML = `
            <div class="game-card-inner">
              <div class="game-image-container">
                ${imageSrc ?
                  `<img src="${imageSrc}" alt="${title}" class="game-image" onerror="this.outerHTML='<div class=\\'game-placeholder\\'>${title}</div>'">` :
                  `<div class="game-placeholder">${title}</div>`
                }
              </div>
              <div class="game-info-section">
                <div class="game-title">${title}</div>
                <div class="game-publisher">${game.creator || 'Tames'}</div>
              </div>
            </div>
          `;
          card.addEventListener('click', () => {
            const launchScreen = document.getElementById('game-launch-screen');
            const brandingScreen = document.getElementById('game-branding-screen');
            const imageHTML = imageSrc ?
              `<img src="${imageSrc}" alt="${title}">` :
              `<div class="game-launch-placeholder">${title}</div>`;

            document.getElementById('game-launch-ghost').innerHTML = imageHTML;
            document.getElementById('game-launch-main').innerHTML = imageHTML;

            const gameIframe = document.getElementById('game-iframe');
            gameIframe.src = 'games/' + game.name;

            launchScreen.classList.add('active');
            launchScreen.classList.add('game-launch-fade');

            setTimeout(() => brandingScreen.classList.add('active'), 2300);

            setTimeout(() => {
              document.getElementById('game-view').classList.add('active');
              document.getElementById('game-bottom-bar').classList.add('show');
              launchScreen.classList.remove('active');
              brandingScreen.classList.remove('active');
            }, 4800);
          });
          gamesGrid.appendChild(card);
        });
      } catch (error) {
        loadingElement.textContent = `Error: ${error.message}`;
      }
    }

    setTimeout(() => {
      document.querySelector('.startup-screen')?.remove();
      document.querySelector('.branding-screen')?.remove();
    }, 5000);

    document.addEventListener('DOMContentLoaded', discoverGames);
  </script>
</body>
</html>
