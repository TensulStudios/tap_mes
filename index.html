          const visibleGames = games.filter((game) => `${game.title} ${game.slug}`.toLocaleLowerCase().includes(query));
          visibleGames.sort((first, second) => {
            const firstStats = gameStats[first.slug] || { playedMs: 0, lastPlayedAt: null };
            const secondStats = gameStats[second.slug] || { playedMs: 0, lastPlayedAt: null };
            if (gameSort === 'recent') {
              const recentOrder = (secondStats.lastPlayedAt || 0) - (firstStats.lastPlayedAt || 0);
              if (recentOrder) return recentOrder;
            }
            if (gameSort === 'hours') {
              const playtimeOrder = secondStats.playedMs - firstStats.playedMs;
              if (playtimeOrder) return playtimeOrder;
            }
            return first.title.localeCompare(second.title);
          });
          gameList.replaceChildren();
          visibleGames.forEach((game) => {
            const card = gameCards.get(game.slug);
            const stats = gameStats[game.slug] || { playedMs: 0, lastPlayedAt: null };
            card.playtime.textContent = formatPlaytime(stats.playedMs);
            card.lastPlayed.textContent = stats.lastPlayedAt
              ? `Last played ${lastPlayedFormatter.format(new Date(stats.lastPlayedAt))}`
              : 'Not played yet';
            gameList.append(card.button);
          });
          gameList.append(emptyState);
          emptyState.hidden = visibleGames.length > 0;
        };
        const saveGameLibraryData = () => {
          try {
            localStorage.setItem(gameLibraryStorageKey, JSON.stringify({
              version: 1,
              sort: gameSort,
              games: gameStats
            }));
            return true;
          } catch (error) {
            libraryStatus.textContent = 'Browser storage is unavailable. Save a backup file to keep this history.';
            return false;
          }
        };
        const flushPlaytime = () => {
          if (!activeGameSlug || activePlayStartedAt === null) return;
          const now = Date.now();
          const elapsed = Math.max(0, now - activePlayStartedAt);
          const stats = gameStats[activeGameSlug] || { playedMs: 0, lastPlayedAt: now };
          stats.playedMs += elapsed;
          gameStats[activeGameSlug] = stats;
          activePlayStartedAt = now;
          saveGameLibraryData();
          renderGameList();
        };
        const pauseGameSession = (forgetGame = false) => {
          if (playtimeInterval !== null) {
            clearInterval(playtimeInterval);
            playtimeInterval = null;
          }
          flushPlaytime();
          activePlayStartedAt = null;
          if (forgetGame) activeGameSlug = null;
        };
        games.forEach(createGameCard);
        renderGameList();

        let toolbarHideTimer;
        let pointerNearGameTop = false;
        const isGamePlayerActive = () => root.hidden && !gameLibrary.hidden && gamePicker.hidden && !gamePlayer.hidden;
        const resumeGameSession = () => {
          if (!activeGameSlug || !isGamePlayerActive() || document.visibilityState !== 'visible' || activePlayStartedAt !== null) return;
          activePlayStartedAt = Date.now();
          const stats = gameStats[activeGameSlug] || { playedMs: 0, lastPlayedAt: null };
          stats.lastPlayedAt = activePlayStartedAt;
          gameStats[activeGameSlug] = stats;
          saveGameLibraryData();
          renderGameList();
          playtimeInterval = setInterval(flushPlaytime, 10000);
        };
        const startGameSession = (slug) => {
          pauseGameSession(true);
          activeGameSlug = slug;
          resumeGameSession();
        };
        gameSearch.addEventListener('input', renderGameList);
        gameSortSelect.addEventListener('change', () => {
          gameSort = gameSortSelect.value;
          saveGameLibraryData();
          renderGameList();
        });
        exportBackupButton.addEventListener('click', () => {
          flushPlaytime();
          const backup = {
            version: 1,
            exportedAt: new Date().toISOString(),
            sort: gameSort,
            games: Object.fromEntries(games.map((game) => {
              const stats = gameStats[game.slug] || { playedMs: 0, lastPlayedAt: null };
              return [game.slug, { title: game.title, ...stats }];
            }))
          };
          const blobUrl = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }));
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = `tap-mes-game-library-${new Date().toISOString().slice(0, 10)}.json`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          libraryStatus.textContent = 'Game history backup saved.';
        });
        importBackupButton.addEventListener('click', () => backupFileInput.click());
        backupFileInput.addEventListener('change', async () => {
          const file = backupFileInput.files?.[0];
          if (!file) return;
          try {
            const backup = JSON.parse(await file.text());
            if (backup?.version !== 1 || !backup.games || typeof backup.games !== 'object' || Array.isArray(backup.games)) {
              throw new Error('Unsupported backup format');
            }
            const importedStats = {};
            games.forEach((game) => {
              const saved = backup.games[game.slug];
              if (!saved) return;
              if (!Number.isFinite(saved.playedMs) || saved.playedMs < 0 || (saved.lastPlayedAt !== null && !Number.isFinite(saved.lastPlayedAt))) {
                throw new Error('Invalid game statistics');
              }
              importedStats[game.slug] = { playedMs: saved.playedMs, lastPlayedAt: saved.lastPlayedAt };
            });
            gameStats = importedStats;
            gameSort = ['name', 'recent', 'hours'].includes(backup.sort) ? backup.sort : 'name';
            gameSortSelect.value = gameSort;
            saveGameLibraryData();
            renderGameList();
            libraryStatus.textContent = `Loaded history for ${Object.keys(gameStats).length} games.`;
          } catch (error) {
            libraryStatus.textContent = 'Could not load that game history file.';
          } finally {
            backupFileInput.value = '';
          }
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') resumeGameSession();
          else pauseGameSession();
        });
        window.addEventListener('pagehide', () => pauseGameSession());
        const scheduleToolbarHide = () => {
          clearTimeout(toolbarHideTimer);
          if (!isGamePlayerActive()) return;
          toolbarHideTimer = setTimeout(() => {
            toolbarHideTimer = null;
            if (pointerNearGameTop || gameToolbar.matches(':hover')) return;
            gamePlayer.classList.add('toolbar-hidden');
          }, 2000);
        };
        const showGameToolbar = () => {
          if (!isGamePlayerActive()) return;
          clearTimeout(toolbarHideTimer);
          gamePlayer.classList.remove('toolbar-hidden');
          scheduleToolbarHide();
        };
        const handlePointerMove = (pointerY, fromGameFrame = false) => {
          if (!isGamePlayerActive()) return;
          if (fromGameFrame) {
            pointerNearGameTop = pointerY <= 64;
          } else {
            const playerTop = gamePlayer.getBoundingClientRect().top;
            pointerNearGameTop = pointerY >= playerTop && pointerY <= playerTop + 64;
          }
          if (pointerNearGameTop) showGameToolbar();
          else if (!toolbarHideTimer && !gamePlayer.classList.contains('toolbar-hidden')) scheduleToolbarHide();
        };

        const updateFullscreenButton = () => {
          const isFullscreen = document.fullscreenElement === gamePlayer;
          fullscreenButton.setAttribute('aria-label', isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen');
          fullscreenButton.title = isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen';
          fullscreenIcon.setAttribute('d', isFullscreen
            ? 'M3 8V5a2 2 0 0 1 2-2h3m8 0h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3'
            : 'M9 3H5a2 2 0 0 0-2 2v4m12-6h4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4m6 0h4a2 2 0 0 0 2-2v-4');
        };
        const exitGameFullscreen = () => {
          if (document.fullscreenElement === gamePlayer) document.exitFullscreen();
        };
        const toggleGameFullscreen = async () => {
          try {
            if (document.fullscreenElement === gamePlayer) await document.exitFullscreen();
            else await gamePlayer.requestFullscreen();
          } catch (error) {
            showGameToolbar();
          }
        };

        const showLibrary = () => {
          root.classList.remove('game-background-overlay');
          gameLibrary.classList.remove('game-library-background');
          root.hidden = true;
          gameLibrary.hidden = false;
          if (gamePicker.hidden && !gamePlayer.hidden) {
            resumeGameSession();
            showGameToolbar();
          }
        };
        const showRoot = () => {
          pauseGameSession();
          clearTimeout(toolbarHideTimer);
          gamePlayer.classList.add('toolbar-hidden');
          exitGameFullscreen();
          gameLibrary.hidden = false;
          gameLibrary.classList.add('game-library-background');
          root.classList.add('game-background-overlay');
          root.hidden = false;
        };
        const showGameList = () => {
          pauseGameSession(true);
          clearTimeout(toolbarHideTimer);
          exitGameFullscreen();
          gameFrame.removeAttribute('src');
          gamePlayer.classList.remove('toolbar-hidden');
          gamePlayer.hidden = true;
          gamePicker.hidden = false;
        };
        const returnToRootOnL = (event) => {
          if (!isGamePlayerActive()) return;
          if (event.key?.toLowerCase() !== 'l' || event.ctrlKey || event.altKey || event.metaKey) return;
          event.preventDefault();
          event.stopPropagation();
          showRoot();
        };
        const hookedGameWindows = new WeakSet();
        const watchedGameDocuments = new WeakSet();
        const watchedGameFrames = new WeakSet();
        const attachGameKeyboard = (gameWindow) => {
          if (!gameWindow) return;
          if (!hookedGameWindows.has(gameWindow)) {
            try {
              gameWindow.addEventListener('keydown', returnToRootOnL, true);
            } catch (error) {
              if (error instanceof DOMException && error.name === 'SecurityError') return;
              throw error;
            }
            hookedGameWindows.add(gameWindow);
          }
          let gameDocument;
          try {
            gameDocument = gameWindow.document;
          } catch (error) {
            if (error instanceof DOMException && error.name === 'SecurityError') return;
            throw error;
          }
          if (watchedGameDocuments.has(gameDocument)) return;
          watchedGameDocuments.add(gameDocument);
          const watchChildFrames = () => {
            gameDocument.querySelectorAll('iframe').forEach((frame) => {
              if (!watchedGameFrames.has(frame)) {
                watchedGameFrames.add(frame);
                frame.addEventListener('load', () => attachGameKeyboard(frame.contentWindow));
              }
              attachGameKeyboard(frame.contentWindow);
            });
          };
          watchChildFrames();
          gameDocument.addEventListener('load', (event) => {
            if (event.target?.tagName === 'IFRAME') {
              attachGameKeyboard(event.target.contentWindow);
            }
          }, true);
        };

        const settingsButton = [...document.querySelectorAll('._NavButton_wakoh_13')]
          .find((button) => button.textContent.trim().endsWith('Homework'));
        settingsButton?.removeAttribute('onclick');
        settingsButton?.addEventListener('click', showLibrary);
        const homeworkNudge = document.querySelector('#homework-nudge');
        const dismissHomeworkNudge = () => homeworkNudge.classList.add('homework-nudge-dismissed');
        document.querySelector('#homework-nudge-dismiss').addEventListener('click', dismissHomeworkNudge);
        setTimeout(dismissHomeworkNudge, 6000);
        document.querySelector('#game-player-home').addEventListener('click', showRoot);
        document.querySelector('#game-player-back').addEventListener('click', showGameList);
        fullscreenButton.addEventListener('click', toggleGameFullscreen);
        gameToolbar.addEventListener('pointerenter', showGameToolbar);
        gameToolbar.addEventListener('pointerleave', () => {
          pointerNearGameTop = false;
          scheduleToolbarHide();
        });
        document.addEventListener('pointermove', (event) => handlePointerMove(event.clientY));
        document.addEventListener('fullscreenchange', () => {
          updateFullscreenButton();
          showGameToolbar();
        });
        gameSidebarHome?.addEventListener('click', showRoot);
        window.addEventListener('keydown', (event) => {
          if (!gameLibrary.hidden) returnToRootOnL(event);
        });
        gameFrame.addEventListener('load', () => {
          try {
            attachGameKeyboard(gameFrame.contentWindow);
            gameFrame.contentWindow.addEventListener('pointermove', (event) => handlePointerMove(event.clientY, true));
          } catch (error) {
            if (!(error instanceof DOMException && error.name === 'SecurityError')) throw error;
          }
        });
      })();
    </script>
    <div class="spx-status-embed"></div>
</body>
